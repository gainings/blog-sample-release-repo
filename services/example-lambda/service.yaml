# Lambda (コンテナイメージ) を lambroll でデプロイする例。
name: example-lambda
kind: lambda
source: gainings/example-lambda-repo

image:
  registry: 111111111111.dkr.ecr.ap-northeast-1.amazonaws.com
  repository: example-lambda

environments:
  dev:
    aws:
      region: ap-northeast-1
      account_id: "111111111111"
      role_arn: arn:aws:iam::111111111111:role/gha-release-example-lambda-dev
    vars:
      MEMORY_SIZE: "256"
  prod:
    requires_release: true
    aws:
      region: ap-northeast-1
      account_id: "333333333333"
      role_arn: arn:aws:iam::333333333333:role/gha-release-example-lambda-prod
    vars:
      MEMORY_SIZE: "512"
