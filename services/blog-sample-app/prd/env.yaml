# blog-sample-app の prd 環境。デプロイ定義は同じディレクトリの ecspresso/ にある。
kind: ecs                                   # ecs | lambda | cloudrun
requires_release: true   # release_tag (tagpr のタグ) 付きの dispatch でだけデプロイする

image:                                      # デプロイするイメージ (タグは dispatch の image_tag)
  registry: 111111111111.dkr.ecr.ap-northeast-1.amazonaws.com
  repository: blog-sample-app

aws:
  region: ap-northeast-1
  account_id: "333333333333"
  role_arn: arn:aws:iam::333333333333:role/gha-release-blog-sample-app-prd

# vars: (任意) デプロイ定義のテンプレートに環境変数として渡す値
