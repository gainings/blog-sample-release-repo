# サービス定義マニフェスト。release.yml / deploy.yml / rollback.yml はこのファイルだけを見て動く。
name: blog-sample-app
kind: ecs                                   # ecs | lambda | cloudrun
source: gainings/blog-sample-app-repo1      # dispatch 元 (ドキュメント用)

image:
  registry: 111111111111.dkr.ecr.ap-northeast-1.amazonaws.com
  repository: blog-sample-app

# 環境は dev → stg → prod の順にデプロイされる。定義していない環境はスキップされる。
# requires_release: true の環境は、dispatch に release_tag (tagpr のタグ) が付いている時だけデプロイされる。
environments:
  dev:
    aws:
      region: ap-northeast-1
      account_id: "111111111111"
      role_arn: arn:aws:iam::111111111111:role/gha-release-blog-sample-app-dev
    vars:                                   # デプロイ定義 (ecspresso テンプレート) に環境変数として渡される
      TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:ap-northeast-1:111111111111:targetgroup/blog-sample-app-dev/0123456789abcdef
      SUBNET_ID_1: subnet-0dev000000000001
      SUBNET_ID_2: subnet-0dev000000000002
      SECURITY_GROUP_ID: sg-0dev00000000000
      DESIRED_COUNT: "1"
  stg:
    aws:
      region: ap-northeast-1
      account_id: "222222222222"
      role_arn: arn:aws:iam::222222222222:role/gha-release-blog-sample-app-stg
    vars:
      TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:ap-northeast-1:222222222222:targetgroup/blog-sample-app-stg/0123456789abcdef
      SUBNET_ID_1: subnet-0stg000000000001
      SUBNET_ID_2: subnet-0stg000000000002
      SECURITY_GROUP_ID: sg-0stg00000000000
      DESIRED_COUNT: "1"
  prod:
    requires_release: true
    aws:
      region: ap-northeast-1
      account_id: "333333333333"
      role_arn: arn:aws:iam::333333333333:role/gha-release-blog-sample-app-prod
    vars:
      TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:ap-northeast-1:333333333333:targetgroup/blog-sample-app-prod/0123456789abcdef
      SUBNET_ID_1: subnet-0prd000000000001
      SUBNET_ID_2: subnet-0prd000000000002
      SECURITY_GROUP_ID: sg-0prd00000000000
      DESIRED_COUNT: "2"
