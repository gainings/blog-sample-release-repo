# Cloud Run を gcloud run services replace でデプロイする例。
kind: cloudrun
requires_release: true

image:                                      # 環境ごとの Artifact Registry
  registry: asia-northeast1-docker.pkg.dev/example-project-prd/apps
  repository: example-cloudrun

gcp:
  project_id: example-project-prd
  region: asia-northeast1
  workload_identity_provider: projects/000000000002/locations/global/workloadIdentityPools/github/providers/github
  service_account: gha-release@example-project-prd.iam.gserviceaccount.com
