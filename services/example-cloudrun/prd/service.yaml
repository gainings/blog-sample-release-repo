# Knative Service 形式。${IMAGE} だけ envsubst で置換される。
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: example-cloudrun-prd
  labels:
    environment: prd
    managed-by: release-repo
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: ${IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: prd
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
