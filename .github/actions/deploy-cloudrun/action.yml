name: Deploy to Cloud Run (gcloud)
description: <dir>/service.yaml を envfile で envsubst し、gcloud run services replace で適用する

inputs:
  dir:
    description: 環境ディレクトリ (services/<service>/<env>)
    required: true
  gcp_project_id:
    required: true
  gcp_region:
    required: true
  gcp_workload_identity_provider:
    description: Workload Identity 連携のプロバイダ (projects/.../providers/...)
    required: true
  gcp_service_account:
    required: true

runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
        service_account: ${{ inputs.gcp_service_account }}

    - uses: google-github-actions/setup-gcloud@v2

    - name: Render and replace
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
        PROJECT: ${{ inputs.gcp_project_id }}
        REGION: ${{ inputs.gcp_region }}
      run: |
        set -euo pipefail
        set -a; . "$DIR/envfile"; set +a
        envsubst < "$DIR/service.yaml" > "$RUNNER_TEMP/service.yaml"
        cat "$RUNNER_TEMP/service.yaml"
        # replace は新リビジョンが Ready になるまで待つ。失敗時はトラフィックが移らない
        gcloud run services replace "$RUNNER_TEMP/service.yaml" --project "$PROJECT" --region "$REGION"
