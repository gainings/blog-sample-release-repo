name: Deploy to ECS (ecspresso)
description: <dir>/ecspresso.yml (+ ecs-task-def.json, ecs-service-def.json, envfile) を ecspresso でデプロイする

inputs:
  dir:
    description: 環境ディレクトリ (services/<service>/<env>)
    required: true
  aws_role_arn:
    description: OIDC で Assume するデプロイ用ロール (GitHub Environment の variable)
    required: true
  aws_region:
    required: true
  ecspresso_version:
    required: false
    default: v2.8.5

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        aws-region: ${{ inputs.aws_region }}

    - uses: kayac/ecspresso@v2
      with:
        version: ${{ inputs.ecspresso_version }}

    - name: ecspresso verify / diff / deploy
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
      run: |
        set -euo pipefail
        e() { ecspresso --envfile "$DIR/envfile" --config "$DIR/ecspresso.yml" "$@"; }
        # イメージの存在、IAM ロール、ロググループ等を事前検証する
        e verify
        # 現在のタスク定義/サービスとの差分をログに残す
        e diff || true
        # サービスが安定するまで待つ。失敗時はサーキットブレーカーが前リビジョンへ戻す
        e deploy
