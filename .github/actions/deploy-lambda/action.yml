name: Deploy to Lambda (lambroll)
description: <dir>/function.json (+ envfile) を lambroll でデプロイする (コンテナイメージ)

inputs:
  dir:
    description: 環境ディレクトリ (services/<service>/<env>)
    required: true
  aws_role_arn:
    required: true
  aws_region:
    required: true
  lambroll_version:
    required: false
    default: v1.5.3

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        aws-region: ${{ inputs.aws_region }}

    - uses: fujiwara/lambroll@v1
      with:
        version: ${{ inputs.lambroll_version }}

    - name: lambroll diff / deploy
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
      run: |
        set -euo pipefail
        l() { lambroll --envfile "$DIR/envfile" "$@" --function "$DIR/function.json"; }
        l diff || true
        # 新しいバージョンを publish し、エイリアス current を付け替える
        l deploy
