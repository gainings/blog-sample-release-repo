# main にあるものをリリースする。
#
# - push (main): そのコミットで変更があった services/<service>/<env>/ をすべて適用する (並列)。
#   環境ごとの順序付けはしない。「いつ main に入るか」がそのまま「いつ適用されるか」になる
#   (dev / stg はアプリ側の auto-merge で即時、prd はタグ作成時に作られる PR の手動マージで)。
# - workflow_dispatch: 引数なし。main の全サービス・全環境を再適用する (差分がなければ各ツールが no-op に近い)。
#
# 入力は持たない。「何をどこに出すか」はすべてリポジトリの内容 (= main) で決まる。
# ロールバックは対象コミットを git revert して main にマージする。
name: Release

on:
  push:
    branches: [main]
    paths: [services/**]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  changes:
    name: detect changed environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.c.outputs.matrix }}
      count: ${{ steps.c.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "full sync: all environments"
            dirs=$(find services -mindepth 2 -maxdepth 2 -type d | sort)
          else
            dirs=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- services/ \
              | awk -F/ 'NF >= 4 { print $1"/"$2"/"$3 }' | sort -u)
          fi
          # 削除された環境は対象外
          dirs=$(for d in $dirs; do [ -d "$d" ] && echo "$d" || true; done)

          matrix=$(echo "$dirs" | awk -F/ 'NF == 3 { print $2, $3 }' \
            | while read -r svc env; do jq -n --arg service "$svc" --arg env "$env" '{service: $service, env: $env}'; done \
            | jq -cs '{include: .}')
          count=$(echo "$matrix" | jq '.include | length')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "targets (${count}):"; echo "${dirs:-  (none)}"
          {
            echo "## Release ${GITHUB_SHA::7}"
            echo '```'
            echo "${dirs:-(no changes under services/)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: changes
    if: needs.changes.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      service: ${{ matrix.service }}
      environment: ${{ matrix.env }}
