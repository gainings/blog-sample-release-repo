# main にあるものをリリースする。
#
# - push (main): そのコミットで変更があった services/<service>/<env>/ を dev → stg → prd の順にデプロイする。
#   同じ環境の複数サービスは並列。前段の環境が失敗したら後段には進まない。
# - workflow_dispatch: 引数なし。main の全サービス・全環境を再デプロイする (差分がなければ各ツールが no-op に近い)。
#
# 入力は持たない。「何をどこに出すか」はすべてリポジトリの内容 (= main) で決まる。
# ロールバックは対象コミットを git revert して main にマージする。
name: Release

on:
  push:
    branches: [main]
    paths: [services/**]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  changes:
    name: detect changed environments
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.c.outputs.dev }}
      stg: ${{ steps.c.outputs.stg }}
      prd: ${{ steps.c.outputs.prd }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "full sync: all environments"
            dirs=$(find services -mindepth 2 -maxdepth 2 -type d | sort)
          else
            dirs=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- services/ \
              | awk -F/ 'NF >= 4 { print $1"/"$2"/"$3 }' | sort -u)
          fi
          # 削除された環境は対象外
          dirs=$(for d in $dirs; do [ -d "$d" ] && echo "$d" || true; done)

          echo "targets:"; echo "${dirs:-  (none)}"
          for env in dev stg prd; do
            list=$(echo "$dirs" | awk -F/ -v e="$env" '$3 == e { print $2 }' | jq -R . | jq -cs .)
            echo "${env}=${list}" >> "$GITHUB_OUTPUT"
            echo "${env}: ${list}"
          done
          {
            echo "## Release ${GITHUB_SHA::7}"
            echo '```'
            echo "${dirs:-(no changes under services/)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    needs: changes
    if: needs.changes.outputs.dev != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.dev) }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      service: ${{ matrix.service }}
      environment: dev

  deploy-stg:
    needs: [changes, deploy-dev]
    # dev に変更がなければスキップされた dev を飛び越えて進む。dev が失敗していたら進まない
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.stg != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.stg) }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      service: ${{ matrix.service }}
      environment: stg

  deploy-prd:
    needs: [changes, deploy-dev, deploy-stg]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.prd != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.prd) }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      service: ${{ matrix.service }}
      environment: prd
