name: Release

on:
  push:
    branches: [main]
    paths: [services/**]
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    name: detect changed environments
    runs-on: ubuntu-latest
    outputs:
      ecs: ${{ steps.c.outputs.ecs }}
      ecs_count: ${{ steps.c.outputs.ecs_count }}
      lambda: ${{ steps.c.outputs.lambda }}
      lambda_count: ${{ steps.c.outputs.lambda_count }}
      cloudrun: ${{ steps.c.outputs.cloudrun }}
      cloudrun_count: ${{ steps.c.outputs.cloudrun_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "full sync: all environments"
            dirs=$(find services -mindepth 2 -maxdepth 2 -type d | sort)
          else
            dirs=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- services/ \
              | awk -F/ 'NF >= 4 { print $1"/"$2"/"$3 }' | sort -u)
          fi
          dirs=$(for d in $dirs; do [ -d "$d" ] && echo "$d" || true; done)

          ecs='[]'; lambda='[]'; cloudrun='[]'
          for d in $dirs; do
            svc=$(basename "$(dirname "$d")"); env=$(basename "$d")
            kind=$(scripts/kind.sh "$d")
            item=$(jq -cn --arg service "$svc" --arg env "$env" '{service: $service, env: $env}')
            case "$kind" in
              ecs)      ecs=$(jq -c ". + [$item]" <<<"$ecs") ;;
              lambda)   lambda=$(jq -c ". + [$item]" <<<"$lambda") ;;
              cloudrun) cloudrun=$(jq -c ". + [$item]" <<<"$cloudrun") ;;
            esac
            echo "  ${d} (${kind})"
          done
          for k in ecs lambda cloudrun; do
            list=${!k}
            echo "${k}={\"include\":${list}}" >> "$GITHUB_OUTPUT"
            echo "${k}_count=$(jq 'length' <<<"$list")" >> "$GITHUB_OUTPUT"
          done
          {
            echo "## Release ${GITHUB_SHA::7}"
            echo '```'
            echo "${dirs:-(no changes under services/)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-ecs:
    needs: changes
    if: needs.changes.outputs.ecs_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.ecs) }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      service: ${{ matrix.service }}
      environment: ${{ matrix.env }}

  deploy-lambda:
    needs: changes
    if: needs.changes.outputs.lambda_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.lambda) }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-lambda.yml
    with:
      service: ${{ matrix.service }}
      environment: ${{ matrix.env }}

  deploy-cloudrun:
    needs: changes
    if: needs.changes.outputs.cloudrun_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.cloudrun) }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      service: ${{ matrix.service }}
      environment: ${{ matrix.env }}
