name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          set -euo pipefail
          matrix=$(
            find ecs lambda cloudrun -mindepth 2 -maxdepth 2 -type d 2>/dev/null | sort | while read -r d; do
              jq -n --arg dir "$d" '{dir: $dir}'
            done | jq -cs '{include: .}'
          )
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  render:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: render ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: kayac/ecspresso@v2
        with:
          version: v2.8.5
      - uses: fujiwara/lambroll@v1
        with:
          version: v1.5.3
      - run: scripts/render.sh "${{ matrix.dir }}"
