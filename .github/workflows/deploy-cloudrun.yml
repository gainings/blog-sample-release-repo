# Cloud Run へのデプロイ (gcloud run services replace)。services/<service>/<env>/ に service.yaml がある対象に使う。
# 認証先は GitHub Environment (<env>) の variables:
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, GCP_PROJECT_ID, GCP_REGION
# DRY_RUN=true が設定されていれば、認証もデプロイもせず定義のレンダリングだけ行う。
name: Deploy Cloud Run (reusable)

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: ${{ inputs.service }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.service }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      DIR: services/${{ inputs.service }}/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Check definitions
        run: |
          set -euo pipefail
          for f in service.yaml .env; do
            [ -f "$DIR/$f" ] || { echo "::error::${DIR}/${f} not found"; exit 1; }
          done
          {
            echo "### ${{ inputs.service }} → ${{ inputs.environment }} (cloudrun)${{ vars.DRY_RUN == 'true' && ' — DRY RUN, not deployed' || '' }}"
            echo '```'; grep -v '^#' "$DIR/.env"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Render service.yaml
        run: |
          set -euo pipefail
          set -a; . "$DIR/.env"; set +a
          envsubst < "$DIR/service.yaml" > "$RUNNER_TEMP/service.yaml"
          cat "$RUNNER_TEMP/service.yaml"

      - name: Dry run (render only)
        if: vars.DRY_RUN == 'true'
        run: |
          echo "::warning::DRY_RUN is set on environment '${{ inputs.environment }}': rendering only, nothing is deployed"
          scripts/render.sh "${{ inputs.service }}" "${{ inputs.environment }}"

      - name: Check credentials
        if: vars.DRY_RUN != 'true'
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          for v in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GCP_PROJECT_ID GCP_REGION; do
            [ -n "${!v}" ] || { echo "::error::variable ${v} is not set on GitHub Environment '${{ inputs.environment }}'"; exit 1; }
          done

      - uses: google-github-actions/auth@v2
        if: vars.DRY_RUN != 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: vars.DRY_RUN != 'true'

      - name: gcloud run services replace
        if: vars.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          # replace は新リビジョンが Ready になるまで待つ。失敗時はトラフィックが移らない
          gcloud run services replace "$RUNNER_TEMP/service.yaml" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}"
