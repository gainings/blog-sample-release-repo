# 再利用ワークフロー: 1 つのサービスを 1 つの環境にデプロイする。
#   services/<service>/service.yaml  … kind とイメージ (環境に依存しない)
#   services/<service>/<env>/env.yaml … その環境の認証先 (aws / gcp) と任意の vars
#   services/<service>/<env>/<kind 別の定義> … ecspresso/ lambroll/ cloudrun/
# kind に応じたデプロイ方式 (.github/actions/deploy-*) を呼ぶ。
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: "services/ 配下のディレクトリ名"
        required: true
        type: string
      environment:
        description: "dev | stg | prd (GitHub Environments の名前と一致させる)"
        required: true
        type: string
      image_tag:
        description: "イメージタグ (例: sha-<commit sha>)"
        required: true
        type: string

jobs:
  deploy:
    name: ${{ inputs.service }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.service }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Read service / environment manifests
        id: manifest
        env:
          SERVICE: ${{ inputs.service }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          svc="services/${SERVICE}/service.yaml"
          env_dir="services/${SERVICE}/${ENVIRONMENT}"
          envf="${env_dir}/env.yaml"
          if [ ! -f "$svc" ]; then
            echo "::error::unknown service '${SERVICE}' (${svc} not found)"; exit 1
          fi
          if [ ! -f "$envf" ]; then
            echo "::error::environment '${ENVIRONMENT}' is not defined for '${SERVICE}' (${envf} not found)"; exit 1
          fi
          kind=$(yq '.kind' "$svc")
          image="$(yq '.image.registry' "$svc")/$(yq '.image.repository' "$svc"):${IMAGE_TAG}"

          {
            echo "env_dir=${env_dir}"
            echo "kind=${kind}"
            echo "image=${image}"
            echo "aws_region=$(yq '.aws.region // ""' "$envf")"
            echo "aws_account_id=$(yq '.aws.account_id // ""' "$envf")"
            echo "aws_role_arn=$(yq '.aws.role_arn // ""' "$envf")"
            echo "gcp_project_id=$(yq '.gcp.project_id // ""' "$envf")"
            echo "gcp_region=$(yq '.gcp.region // ""' "$envf")"
            echo "gcp_workload_identity_provider=$(yq '.gcp.workload_identity_provider // ""' "$envf")"
            echo "gcp_service_account=$(yq '.gcp.service_account // ""' "$envf")"
          } >> "$GITHUB_OUTPUT"

          # env.yaml の vars (任意) をデプロイ定義のテンプレート用に環境変数として渡す
          yq '.vars // {} | to_entries[] | .key + "=" + (.value | tostring)' "$envf" >> "$GITHUB_ENV"

          {
            echo "### ${SERVICE} → ${ENVIRONMENT}"
            echo "- kind: \`${kind}\`"
            echo "- image: \`${image}\`"
            echo "- definitions: \`${env_dir}/\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy (ecs)
        if: steps.manifest.outputs.kind == 'ecs'
        uses: ./.github/actions/deploy-ecs
        with:
          env_dir: ${{ steps.manifest.outputs.env_dir }}
          environment: ${{ inputs.environment }}
          image: ${{ steps.manifest.outputs.image }}
          aws_region: ${{ steps.manifest.outputs.aws_region }}
          aws_account_id: ${{ steps.manifest.outputs.aws_account_id }}
          aws_role_arn: ${{ steps.manifest.outputs.aws_role_arn }}

      - name: Deploy (lambda)
        if: steps.manifest.outputs.kind == 'lambda'
        uses: ./.github/actions/deploy-lambda
        with:
          env_dir: ${{ steps.manifest.outputs.env_dir }}
          environment: ${{ inputs.environment }}
          image: ${{ steps.manifest.outputs.image }}
          aws_region: ${{ steps.manifest.outputs.aws_region }}
          aws_account_id: ${{ steps.manifest.outputs.aws_account_id }}
          aws_role_arn: ${{ steps.manifest.outputs.aws_role_arn }}

      - name: Deploy (cloudrun)
        if: steps.manifest.outputs.kind == 'cloudrun'
        uses: ./.github/actions/deploy-cloudrun
        with:
          env_dir: ${{ steps.manifest.outputs.env_dir }}
          environment: ${{ inputs.environment }}
          image: ${{ steps.manifest.outputs.image }}
          gcp_project_id: ${{ steps.manifest.outputs.gcp_project_id }}
          gcp_region: ${{ steps.manifest.outputs.gcp_region }}
          gcp_workload_identity_provider: ${{ steps.manifest.outputs.gcp_workload_identity_provider }}
          gcp_service_account: ${{ steps.manifest.outputs.gcp_service_account }}

      - name: Unknown kind
        if: ${{ !contains(fromJSON('["ecs","lambda","cloudrun"]'), steps.manifest.outputs.kind) }}
        run: |
          echo "::error::unsupported kind '${{ steps.manifest.outputs.kind }}'"; exit 1
