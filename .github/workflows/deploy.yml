# 再利用ワークフロー: 1 つのサービスを 1 つの環境にデプロイする。
# services/<service>/<env>/ にある定義ファイルの種類でデプロイ方式を判定し (.env はイメージ等の値)、
# 認証先は GitHub Environment (<env>) の variables から取る。
#   AWS: AWS_ROLE_ARN, AWS_REGION
#   GCP: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, GCP_PROJECT_ID, GCP_REGION
# Environment の variable に DRY_RUN=true があれば、認証もデプロイもせず定義のレンダリングだけ行う (フローの確認用)。
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: "services/ 配下のディレクトリ名"
        required: true
        type: string
      environment:
        description: "環境ディレクトリ名 (例: dev | stg | prd)。同名の GitHub Environment から認証先を取る"
        required: true
        type: string

jobs:
  deploy:
    name: ${{ inputs.service }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.service }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Detect kind
        id: kind
        env:
          DIR: services/${{ inputs.service }}/${{ inputs.environment }}
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: |
          set -euo pipefail
          [ -d "$DIR" ] || { echo "::error::${DIR} not found"; exit 1; }
          kind=$(scripts/kind.sh "$DIR")
          [ "$DRY_RUN" = "true" ] && kind_check=skip || kind_check="$kind"
          case "$kind_check" in
            ecs|lambda)
              for v in AWS_ROLE_ARN AWS_REGION; do
                [ -n "${!v}" ] || { echo "::error::variable ${v} is not set on GitHub Environment '${ENVIRONMENT}'"; exit 1; }
              done ;;
            cloudrun)
              for v in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GCP_PROJECT_ID GCP_REGION; do
                [ -n "${!v}" ] || { echo "::error::variable ${v} is not set on GitHub Environment '${ENVIRONMENT}'"; exit 1; }
              done ;;
          esac
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"
          echo "dir=${DIR}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ inputs.service }} → ${ENVIRONMENT} (${kind})${DRY_RUN:+ — DRY RUN, not deployed}"
            echo '```'
            grep -v '^#' "$DIR/.env"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- DRY_RUN: レンダリングだけ行う ----
      - uses: kayac/ecspresso@v2
        if: vars.DRY_RUN == 'true' && steps.kind.outputs.kind == 'ecs'
        with:
          version: v2.8.5
      - uses: fujiwara/lambroll@v1
        if: vars.DRY_RUN == 'true' && steps.kind.outputs.kind == 'lambda'
        with:
          version: v1.5.3
      - name: Dry run (render only)
        if: vars.DRY_RUN == 'true'
        run: |
          echo "::warning::DRY_RUN is set on environment '${{ inputs.environment }}': rendering only, nothing is deployed"
          scripts/render.sh "${{ inputs.service }}" "${{ inputs.environment }}"

      # ---- 本番の経路 ----
      - name: Deploy (ecs)
        if: vars.DRY_RUN != 'true' && steps.kind.outputs.kind == 'ecs'
        uses: ./.github/actions/deploy-ecs
        with:
          dir: ${{ steps.kind.outputs.dir }}
          aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}

      - name: Deploy (lambda)
        if: vars.DRY_RUN != 'true' && steps.kind.outputs.kind == 'lambda'
        uses: ./.github/actions/deploy-lambda
        with:
          dir: ${{ steps.kind.outputs.dir }}
          aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}

      - name: Deploy (cloudrun)
        if: vars.DRY_RUN != 'true' && steps.kind.outputs.kind == 'cloudrun'
        uses: ./.github/actions/deploy-cloudrun
        with:
          dir: ${{ steps.kind.outputs.dir }}
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          gcp_region: ${{ vars.GCP_REGION }}
          gcp_workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
