# 再利用ワークフロー: 1 つのサービスを 1 つの環境にデプロイする。
# services/<service>/<env>/ にある定義ファイルの種類でデプロイ方式を判定し (envfile はイメージ等の値)、
# 認証先は GitHub Environment (<env>) の variables から取る。
#   AWS: AWS_ROLE_ARN, AWS_REGION
#   GCP: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, GCP_PROJECT_ID, GCP_REGION
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: "services/ 配下のディレクトリ名"
        required: true
        type: string
      environment:
        description: "dev | stg | prd (GitHub Environments の名前と一致させる)"
        required: true
        type: string

jobs:
  deploy:
    name: ${{ inputs.service }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.service }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Detect kind
        id: kind
        env:
          DIR: services/${{ inputs.service }}/${{ inputs.environment }}
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          [ -d "$DIR" ] || { echo "::error::${DIR} not found"; exit 1; }
          kind=$(scripts/kind.sh "$DIR")
          case "$kind" in
            ecs|lambda)
              for v in AWS_ROLE_ARN AWS_REGION; do
                [ -n "${!v}" ] || { echo "::error::variable ${v} is not set on GitHub Environment '${ENVIRONMENT}'"; exit 1; }
              done ;;
            cloudrun)
              for v in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GCP_PROJECT_ID GCP_REGION; do
                [ -n "${!v}" ] || { echo "::error::variable ${v} is not set on GitHub Environment '${ENVIRONMENT}'"; exit 1; }
              done ;;
          esac
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"
          echo "dir=${DIR}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ inputs.service }} → ${ENVIRONMENT} (${kind})"
            echo '```'
            grep -v '^#' "$DIR/envfile"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy (ecs)
        if: steps.kind.outputs.kind == 'ecs'
        uses: ./.github/actions/deploy-ecs
        with:
          dir: ${{ steps.kind.outputs.dir }}
          aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}

      - name: Deploy (lambda)
        if: steps.kind.outputs.kind == 'lambda'
        uses: ./.github/actions/deploy-lambda
        with:
          dir: ${{ steps.kind.outputs.dir }}
          aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}

      - name: Deploy (cloudrun)
        if: steps.kind.outputs.kind == 'cloudrun'
        uses: ./.github/actions/deploy-cloudrun
        with:
          dir: ${{ steps.kind.outputs.dir }}
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          gcp_region: ${{ vars.GCP_REGION }}
          gcp_workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
