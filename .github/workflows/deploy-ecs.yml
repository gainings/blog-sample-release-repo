name: Deploy ECS (reusable)

on:
  workflow_call:
    inputs:
      dir:
        required: true
        type: string
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: ${{ inputs.dir }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.dir }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      DIR: ${{ inputs.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Check definitions
        run: |
          set -euo pipefail
          for f in ecspresso.yml .env; do
            [ -f "$DIR/$f" ] || { echo "::error::${DIR}/${f} not found"; exit 1; }
          done
          {
            echo "### ${{ inputs.dir }}${{ vars.DRY_RUN == 'true' && ' — DRY RUN, not deployed' || '' }}"
            echo '```'; grep -v '^#' "$DIR/.env"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: kayac/ecspresso@v2
        with:
          version: v2.8.5

      - name: Dry run (render only)
        if: vars.DRY_RUN == 'true'
        run: |
          echo "::warning::DRY_RUN is set on environment '${{ inputs.environment }}': rendering only, nothing is deployed"
          scripts/render.sh "$DIR"

      - name: Check credentials
        if: vars.DRY_RUN != 'true'
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          for v in AWS_ROLE_ARN AWS_REGION; do
            [ -n "${!v}" ] || { echo "::error::variable ${v} is not set on GitHub Environment '${{ inputs.environment }}'"; exit 1; }
          done

      - uses: aws-actions/configure-aws-credentials@v4
        if: vars.DRY_RUN != 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ecspresso verify / diff / deploy
        if: vars.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          e() { ecspresso --envfile "$DIR/.env" --config "$DIR/ecspresso.yml" "$@"; }
          e verify
          e diff || true
          e deploy
